<!doctype html>
<!--
  Source for public/og-image.jpg, the link-preview image every page points to (src/layouts/Layout.astro).
  Regenerate with `node scripts/render-og-image.mjs` after changing this file. It's a 1200 × 630 canvas;
  nothing here ships with the site.

  It reuses the site's brand pieces: the hero's black and its headline, the footer's grainy VF mark with the
  V's top bar run out to the right margin, and the reviews section's glow, here rising from that bar.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }

      /* Copied from src/styles/globals.css :root. */
      :root {
        --chart-1: oklch(0.865 0.127 207.078);
        --chart-4: oklch(0.52 0.105 223.128);
      }

      html,
      body {
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Inter", sans-serif;
      }

      /* Rises from the bar (its bottom edge is the bar's top), off to the right so the headline stays on black.
         The mask fades it out before the bar's slanted end, so it never meets the black beside the bar in a hard line. */
      .glow {
        position: absolute;
        inset: 0 0 auto 0;
        height: 300px;
        background: radial-gradient(
          ellipse 520px 300px at 900px 100%,
          oklch(from var(--chart-1) calc(l * 0.7) c h / 0.65),
          oklch(from var(--chart-1) l c h / 0.22) 45%,
          transparent
        );
        mask-image: linear-gradient(to right, #000 900px, transparent 1120px);
      }

      h1 {
        position: absolute;
        top: 70px;
        left: 72px;
        margin: 0;
        font-size: 84px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.025em;
      }

      h1 span {
        color: var(--chart-1);
      }

      .mark {
        position: absolute;
        inset: 0;
      }

      .lockup {
        position: absolute;
        top: 372px;
        left: 552px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* The wordmark's letters only (its VF mark is cropped off by the viewBox), white. */
      .lockup svg {
        display: block;
        height: 58px;
        width: auto;
      }

      .lockup p {
        margin: 0;
        font-size: 28px;
        font-weight: 500;
        color: rgb(255 255 255 / 0.6);
      }

      /* Same tile and blend as `.grain` in globals.css; overlay leaves the black untouched. */
      .grain {
        position: absolute;
        inset: 0;
        background-image: url("../public/textures/grain.png");
        background-size: 512px 512px;
        mix-blend-mode: overlay;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <h1>Working <span>capital.</span><br />Built for <span>growth.</span></h1>
